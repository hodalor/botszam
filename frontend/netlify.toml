# Netlify — botszam storefront
#
# Recommended Netlify UI settings (Site configuration → Build & deploy):
#   Base directory:     frontend
#   Package directory:  (leave empty)
#   Build command:      npm run build
#   Publish directory:  dist          ← NOT frontend/dist (base already = frontend)
#   Functions directory: (leave empty)
#
# REQUIRED env vars (Site configuration → Environment variables) — then Clear
# cache and deploy site. Vite bakes these in at build time:
#   VITE_API_URL  = https://YOUR-SERVICE.onrender.com/api
#   VITE_SITE_URL = https://botszam.netlify.app
#
# Also set on Render: FRONTEND_URL = https://botszam.netlify.app  (CORS)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — React Router client routes must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security / caching headers for the static app shell
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
